name: Pane live source parity acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare exact live and candidate tracked archives
        shell: bash
        run: |
          set -euo pipefail
          live=479e15cf8daf28c949e6f6bfc7ba4c08a4f4b609
          candidate=24a142a0dcccc7bab660a7884f67b39540ad3752
          mkdir -p "$RUNNER_TEMP/pane-live" "$RUNNER_TEMP/pane-candidate" pane-parity-evidence
          git archive "$live" | tar -x -C "$RUNNER_TEMP/pane-live"
          git archive "$candidate" | tar -x -C "$RUNNER_TEMP/pane-candidate"
          python3 tools/qa-pane-app-parity.py "$RUNNER_TEMP/pane-live" "$RUNNER_TEMP/pane-candidate" --json | tee pane-parity-evidence/report.json
          git merge-base --is-ancestor "$live" "$candidate"
          git merge-base --is-ancestor d19c5ba69de6e47f12c8da32ed43cc4d12974cae "$candidate"
          git diff --exit-code "$live" "$candidate" -- web/core/app-capture.js web/core/app-services.js web/core/web-update.js
          printf '%s\n' "$live" "$candidate" > pane-parity-evidence/commits.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pane-parity-evidence
          path: pane-parity-evidence/
