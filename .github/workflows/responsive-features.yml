name: Responsive feature contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: QA_OUTPUT=phone-evidence node tools/qa-tap-outside-closes.cjs
      - run: node tests/qa-store-install-deeplink.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-host-2-phone-evidence
          path: phone-evidence/
